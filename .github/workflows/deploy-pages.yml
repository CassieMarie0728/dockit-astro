name: Deploy Chaos Codex to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://cassiemarie0728.github.io
      BASE_PATH: /dockit-astro
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate, build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@10.4.1
          build-cmd: pnpm check:release && pnpm validate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
